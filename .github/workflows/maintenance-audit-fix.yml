name: Temporary dependency remediation

on:
  push:
    branches:
      - "feat/oss-readiness-2026-09-19"
    paths:
      - ".github/workflows/maintenance-audit-fix.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply audited dependency upgrades
        run: npm audit fix --force

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run portable validation
        run: npm run ci:portable

      - name: Commit dependency remediation
        shell: bash
        run: |
          git status --short
          if git diff --quiet -- package.json package-lock.json apps/web/package.json; then
            echo "No dependency files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json
          git commit -m "chore: remediate dependency security advisories"
          git push origin HEAD:feat/oss-readiness-2026-09-19
