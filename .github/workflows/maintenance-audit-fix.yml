name: Temporary dependency remediation

on:
  push:
    branches:
      - "feat/oss-readiness-2026-09-19"
    paths:
      - ".github/workflows/maintenance-audit-fix.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply audited dependency upgrades
        shell: bash
        run: |
          # npm currently reports that Vitest and Next.js require major-version
          # security upgrades. Preserve npm's remediation changes even when the
          # first audit pass exits non-zero, then explicitly move Next/React to
          # current patched releases.
          npm audit fix --force || true
          npm install --workspace @burhan/web next@16.3.5 react@19.3.0 react-dom@19.3.0
          npm install --workspace @burhan/web --save-dev @types/react@19.3.0 @types/react-dom@19.3.0

      - name: Verify full dependency audit
        run: npm audit --audit-level=high

      - name: Run portable validation
        run: npm run ci:portable

      - name: Commit dependency remediation
        shell: bash
        run: |
          git status --short
          if git diff --quiet; then
            echo "No dependency files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/*/package.json packages/*/package.json examples/*/package.json
          git commit -m "chore: remediate dependency security advisories"
          git push origin HEAD:feat/oss-readiness-2026-09-19
