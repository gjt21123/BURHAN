name: CI

on:
  push:
    branches: [master, 'feat/oss-readiness-*', 'feat/portable-cli-*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: ''
      CODEX_API_KEY: ''
      BURHAN_ENABLE_LIVE_COMPILER: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and workspace tests
        run: npm test
      - name: Offline CLI distribution and independent-repository smoke checks
        run: npm run test:cli-package
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Production HTTP smoke checks without provider calls
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: node scripts/smoke-web.mjs
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Preserve tested CLI tarball and validation metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burhan-cli-${{ matrix.os }}-node${{ matrix.node }}
          path: reports/cli-distribution/
          if-no-files-found: error
          retention-days: 14

  windows-verification:
    name: Full deterministic verification / Windows / Node 22
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: ''
      CODEX_API_KEY: ''
      BURHAN_ENABLE_LIVE_COMPILER: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full deterministic suite
        run: npm run ci:verification
      - name: Verify clean working tree
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  dependency-audit:
    name: All dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  repository-health:
    name: Repository hygiene and application validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node scripts/check-repository.mjs
