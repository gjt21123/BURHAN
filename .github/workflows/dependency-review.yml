name: Dependency Review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Mandatory complete npm vulnerability gate
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Determine dependency graph availability
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const { GITHUB_REPOSITORY: repo, BASE_SHA: base, HEAD_SHA: head, GH_TOKEN: token } = process.env;
          if (![base, head].every(value => /^[a-f0-9]{40}$/.test(value ?? ''))) throw new Error('Invalid comparison refs');
          const response = await fetch(`https://api.github.com/repos/${repo}/dependency-graph/compare/${base}...${head}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            signal: AbortSignal.timeout(30_000)
          });
          if (response.ok) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'available=true\n');
          } else if ([403, 404].includes(response.status)) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'available=false\n');
            const note = `GitHub dependency graph review is unavailable (HTTP ${response.status}). The mandatory full npm audit passed, but this is NOT a successful graph review. Enable Dependency graph in repository security settings to activate the additional comparison.\n`;
            console.log(`::warning::${note.trim()}`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Dependency graph unavailable\n\n${note}`);
          } else {
            throw new Error(`Dependency graph availability check failed with HTTP ${response.status}`);
          }
          NODE
      - name: Additional GitHub dependency graph review
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
