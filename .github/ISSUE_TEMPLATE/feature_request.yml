name: Feature proposal
description: Propose a capability or interoperability improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow or limitation motivates this proposal?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful capability.
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: Trust-boundary impact
      options:
        - None / documentation only
        - Untrusted input handling
        - Protected artifacts or workspace
        - Validator compilation or qualification
        - Evidence or verdict generation
        - Provider adapter / execution
        - Security / release infrastructure
        - Unsure
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: How should this be verified?
      description: Suggest positive controls, negative controls, fixtures, or acceptance criteria.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
