name: Bug report
description: Report a reproducible BURHAN defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BURHAN. Remove credentials, private data, and sensitive provider output before submitting.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 20.x
    validations:
      required: true

  - type: dropdown
    id: consequence
    attributes:
      label: Verification consequence
      description: Best current classification.
      options:
        - False accept / incorrect VERIFIED
        - False reject
        - Incomplete or blocked verification
        - Evidence or receipt inconsistency
        - Provider/adapter failure
        - UI or documentation mismatch
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands, fixture, or steps needed to reproduce.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Submission hygiene
      options:
        - label: I removed API keys, credentials, private data, and sensitive provider output.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
